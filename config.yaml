# Central configuration for the data layer.
# Single source of truth — every module reads values from here via src/config.py.

seed: 42                     # global RNG seed for reproducibility

fingerprint:
  radius: 2                  # Morgan / ECFP radius (ECFP4 == radius 2)
  n_bits: 2048              # bit-vector length
  preserve_stereo: true      # canonicalize SMILES with isomeric info (carvone enantiomers differ!)

split:
  test_size: 0.2             # iterative-stratified hold-out fraction
  # validation split is carved from TRAIN by you at modeling time (never from test)

labels:
  taxonomy_source: leffingwell   # anchor the label space on Leffingwell's curated odor classes
  min_positive_count: 30         # drop labels with fewer than this many positives (too rare to learn/eval)
  blocklist:
    - stimulus

sources:
  goodscents:
    molecules: goodscents/molecules.csv
    behavior: goodscents/behavior.csv
    stimuli: goodscents/stimuli.csv
  leffingwell:
    molecules: leffingwell/molecules.csv
    behavior: leffingwell/behavior.csv
    stimuli: leffingwell/stimuli.csv
  # --- Additional sources added to enrich dataset ---
  arctander:
    molecules: arctander_1960/molecules.csv
    behavior: arctander_1960/behavior_1_sparse.csv
    stimuli: arctander_1960/stimuli.csv
  sigma:
    molecules: sigma_2014/molecules.csv
    behavior: sigma_2014/behavior.csv
    stimuli: sigma_2014/stimuli.csv
  flavornet:
    molecules: flavornet/molecules.csv
    behavior: flavornet/behavior.csv
    stimuli: flavornet/stimuli.csv

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  reports_figures: reports/figures
