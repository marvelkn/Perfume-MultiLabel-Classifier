# Conda environment for Google Colab / machines that have conda.
# conda-forge ships a robust RDKit build (preferred over pip on some platforms).
#   conda env create -f environment.yml  &&  conda activate skripsi-aroma
name: skripsi-aroma
channels:
  - conda-forge
dependencies:
  - python=3.10
  - rdkit>=2023.09
  - scikit-learn>=1.3
  - imbalanced-learn>=0.11
  - pandas>=2.0
  - numpy>=1.24,<2.0
  - scipy>=1.10
  - matplotlib>=3.7
  - seaborn>=0.12
  - jupyterlab>=4.0
  - pytest>=7.4
  - pip
  - pip:
      - pyrfume>=0.18
      - iterative-stratification>=0.1.7
      - xgboost>=2.0
      - lightgbm>=4.0
      - skl2onnx>=1.16
      - onnxmltools>=1.12
      - onnxruntime>=1.17
